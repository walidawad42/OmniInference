name: Build OmniInference (Production)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          sudo apt-get install -y libcuda-dev nvidia-cuda-toolkit
          sudo apt-get install -y libvulkan-dev vulkan-tools
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_CUDA=ON \
                -DENABLE_VULKAN=ON ..
      
      - name: Build
        run: cd build && make -j$(nproc)
      
      - name: Create distribution
        run: |
          mkdir -p dist/bin
          cp build/OmniInference dist/bin/
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: OmniInference-Linux
          path: dist/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda: '12.0'
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" `
                -DCMAKE_BUILD_TYPE=Release `
                -DENABLE_CUDA=ON `
                -DENABLE_VULKAN=ON ..
      
      - name: Build
        run: cd build && cmake --build . --config Release --parallel 8
      
      - name: Create distribution
        run: |
          mkdir dist\bin
          copy build\Release\OmniInference.exe dist\bin\
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: OmniInference-Windows
          path: dist/

  test:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Test suite
        run: |
          echo "Running tests..."
          # Test execution

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            OmniInference-Linux/**
            OmniInference-Windows/**